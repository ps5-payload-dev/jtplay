<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <title>JT Play</title>
    <meta name="viewport" content="width=1920"/>
    <link rel="stylesheet" href="css/style.css"/>
  </head>
  <body>

    <video id="media" playsinline></video>

    <div id="shell">
      <div id="topbar">
	<img class="brand-logo" src="icons/logo.png"/>
	<span class="crumb" id="crumb"></span>
	<span class="busy" id="busy">
          <span class="busy-dot busy-dot1"></span>
          <span class="busy-dot busy-dot2"></span>
          <span class="busy-dot busy-dot3"></span>
	</span>
	<span class="spacer"></span>
	<span class="clock" id="clock"></span>
      </div>

      <!-- ====================== Sources ====================== -->
      <div class="content" id="view-sources">
	<div id="sources" class="pane active">
          <div class="pane-head">
            <span class="eyebrow">Media sources</span>
            <span class="count" id="source-count"></span>
          </div>
          <div id="source-list" class="list"></div>
	</div>
      </div>

      <!-- ====================== Browse ======================= -->
      <div class="content" id="view-browse">
	<div id="entries" class="pane active">
          <div class="pane-head">
            <span class="eyebrow" id="browse-title"></span>
            <span class="count" id="entry-count"></span>
          </div>
          <div id="entry-list" class="list"></div>
	</div>
	<div id="details" class="pane">
          <div class="pane-head">
            <span class="eyebrow">Details</span>
          </div>
          <div class="detail-body" id="detail-body">
            <img class="detail-art" id="detail-art"/>
            <div class="detail-desc" id="detail-desc"></div>
          </div>
	</div>
      </div>

      <div id="footer">
	<span class="chip"><img class="key-icon" src="icons/cross.png"/>&nbsp;Select</span>
	<span class="chip"><img class="key-icon" src="icons/circle.png"/>&nbsp;Back</span>
	<span class="chip" id="hint-refresh"><img class="key-icon" src="icons/triangle.png"/>&nbsp;Refresh</span>
	<span class="chip hidden" id="hint-signout"><img class="key-icon" src="icons/square.png"/>&nbsp;Sign out</span>
      </div>
    </div>

    <!-- ====================== Watching ===================== -->

    <!-- Audio: persistent now-playing card in the middle of the screen. -->
    <div id="audio-card">
      <img class="np-art" id="np-art"/>
      <div class="np-title" id="np-title"></div>
      <div class="np-meta" id="np-meta"></div>
      <div class="np-state" id="np-state">PAUSED</div>
    </div>

    <!-- Video: auto-hiding transport bar over the frames. -->
    <div id="watch-bar">
      <img class="watch-thumb" id="watch-thumb"/>
      <div class="watch-main">
	<div class="watch-name" id="watch-name"></div>
	<div class="watch-progress" id="watch-progress">
          <div class="bar" id="watch-progress-bar"></div>
	</div>
      </div>
      <div class="watch-side">
	<div class="watch-time" id="watch-time"></div>
	<div class="watch-hints">
          <span class="chip" id="hint-seek"><img class="key-icon" src="icons/dpad.png"/>&nbsp;Seek</span>
          <span class="chip"><img class="key-icon" src="icons/cross.png"/>&nbsp;Play/Pause</span>
          <span class="chip"><img class="key-icon" src="icons/circle.png"/>&nbsp;Stop</span>
          <span class="chip"><img class="key-icon" src="icons/options.png"/>&nbsp;Info</span>
	</div>
      </div>
    </div>

    <div id="toast"></div>

    <!-- ====================== Sign in ====================== -->
    <div id="auth-overlay">
      <div id="auth-dialog">
	<div class="auth-head">
          <div class="auth-lock"><img src="icons/lock.png"/></div>
          <div class="auth-heading">
            <div class="auth-title" id="auth-title"></div>
            <div class="auth-sub" id="auth-sub"></div>
          </div>
	</div>

	<div class="auth-error" id="auth-error"></div>

	<div class="auth-field" id="auth-row-user">
          <div class="auth-label">Username</div>
          <input class="auth-input" id="auth-user" type="text"
		 autocapitalize="off" autocorrect="off" spellcheck="false"/>
	</div>

	<div class="auth-field" id="auth-row-pass">
          <div class="auth-label">Password</div>
          <input class="auth-input" id="auth-pass" type="password"
		 autocapitalize="off" autocorrect="off" spellcheck="false"/>
	</div>

	<div class="auth-check" id="auth-row-remember">
          <div class="auth-box" id="auth-remember-box"></div>
          <div class="auth-check-label">Remember me</div>
	</div>

	<div class="auth-buttons">
          <div class="auth-btn" id="auth-row-ok">OK</div>
          <div class="auth-btn" id="auth-row-cancel">Cancel</div>
	</div>

	<div class="auth-hints">
          <span class="chip"><img class="key-icon" src="icons/cross.png"/><span id="auth-hint-x">&nbsp;Edit</span></span>
          <span class="chip"><img class="key-icon" src="icons/dpad.png"/>&nbsp;Move</span>
          <span class="chip"><img class="key-icon" src="icons/circle.png"/>&nbsp;Cancel</span>
	</div>
      </div>
    </div>

    <!-- Plugins reach Auth as a global, so it has to be in place first. -->
    <script src="js/auth.js"></script>
    <script src="js/plugins.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
